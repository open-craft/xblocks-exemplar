[project]
name = "exemplar-blocks"
version = "0.13.0"
description = "A collection of XBlocks for managing and displaying aesthetically pleasing HTML content"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.8"
dependencies = [
    "xblock>=5.3.0",
    "pydantic>=2.12.5,<3",
    "nh3>=0.3.4,<0.4.0",  # HTML sanitisation library
]

[project.entry-points."xblock.v1"]
card_carousel = "card_carousel:CardCarouselXBlock"
card_grid = "card_grid_block:CardGridXBlock"
cover = "cover_block:CoverBlock"
keypoints = "keypoint_block:KeypointXBlock"
two_column = "two_column_block:TwoColumnBlock"
ideas_overview = "ideas_overview_block:IdeasOverviewBlock"
unfolding_scenario = "unfolding_scenario:UnfoldingScenarioXBlock"
external_resources = "external_resources:ExternalResourcesXBlock"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=5.2.9",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.1",
    "xblock-sdk>=0.13.0",
    "pydantic-to-typescript>=2.0.0,<3",
    "types-WebOb>=1.8.0.20260408",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xblock.*", "web_fragments.*", "workbench.settings"]
# Attempt to infer types as best as possible.
follow_untyped_imports = true

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = [
    "card_carousel",
    "card_grid_block",
    "cover_block",
    "exemplar_common",
    "keypoint_block",
    "two_column_block",
    "ideas_overview_block",
    "unfolding_scenario",
    "external_resources",
]
wheel-exclude = [
    "keypoint_block/images/**"
]
