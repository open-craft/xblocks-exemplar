[settings]
python.uv_venv_auto = true
experimental = true
env_shell_expand = true

[settings.node]
compile = false

[env]
_.python.venv = { path = ".venv" }

# NOTE: Running this will uninstall the xblock-sdk dependencies, since they aren't part of the project dependencies.
#       After running this, run `mise run init_sdk` if you wish to use the xblock-sdk.
[tasks.install]
description = "Install project dependencies"
depends = "install:*"

[tasks."install:frontend"]
description = "Install project frontend dependencies"
run = "pnpm install"
dir = "./frontend"

[tasks."install:backend"]
description = "Install project backend dependencies"
run = "uv sync"

[tasks.init_sdk]
description = "Init the xblock-sdk in the python environment"
run = [
    "git submodule update --init",
    "uv pip install -e ./xblock-sdk",
    # This may need to be updated if upstream changes how they organize their
    # requirements. We can't use 'pip' here because it doesn't exist in a uv
    # environment. It is, however, handled by the uv pip subcommand.
    "uv pip install -r xblock-sdk/requirements/dev.txt",
    "uv pip install -r xblock-sdk/requirements/local.txt",
    "cd xblock-sdk && uv run ./manage.py migrate",
]

[tasks.sync-types]
description = "Generate Typescript types from Pydantic models in the backend (requires frontend dependencies to be installed)."
run = [
    "pydantic2ts --module ./src/two_column_block/types.py --output ./frontend/src/two-column-block/apiTypes.ts --json2ts-cmd ./frontend/node_modules/.bin/json2ts",
    "pydantic2ts --module ./src/cover_block/types.py --output ./frontend/src/cover-block/apiTypes.ts  --json2ts-cmd \"./frontend/node_modules/.bin/json2ts --inferStringEnumKeysFromValues\"",
    "pydantic2ts --module ./src/ideas_overview_block/types.py --output ./frontend/src/ideas-overview-block/apiTypes.ts --json2ts-cmd \"./frontend/node_modules/.bin/json2ts --inferStringEnumKeysFromValues\"",
    "pydantic2ts --module ./src/unfolding_scenario/types.py --output ./frontend/src/unfolding-scenario-block/apiTypes.ts --json2ts-cmd \"./frontend/node_modules/.bin/json2ts\"",
]

[tasks."format:backend"]
description = "Apply standard formatting to backend code files"
run = ["uv run ruff check --fix src", "uv run ruff format src"]

[tasks."format:frontend"]
description = "Apply standard formatting to fontend code files"
run = "pnpm run format"
dir = "./frontend"

[tasks.format]
description = "Apply standard formatting to code files"
depends = "format:*"

[tasks."quality:backend"]
description = "Run quality checks on the backend code"
run = [
    "uv run ruff check src",
    "uv run ruff format --check src",
    "uv run mypy src",
]

[tasks."quality:frontend"]
description = "Run quality checks on the frontend code"
run = "pnpm run lint"
dir = "./frontend"

[tasks.quality]
description = "Run quality checks on the code"
depends = "quality:*"

[tasks.dev]
description = "Run a dev server"
env = { EXCLUDE_SAMPLE_XBLOCKS = "yes", DJANGO_SETTINGS_MODULE = "test_settings" }
run = "uv run ./manage.py runserver"
dir = "./xblock-sdk"


[tasks."test:backend:unit"]
description = "Run Python unit tests"
env = { DJANGO_SETTINGS_MODULE = "ci_settings" }
run = ["uv run pytest --cov=src src", "uv run coverage html"]

[tasks."test:backend"]
description = "Run all backend Python tests"
depends = ["quality:backend", "test:backend:unit"]


[tasks."test:frontend:unit"]
description = "Run all frontend TypeScript unit tests"
run = "pnpm run test"
dir = "./frontend"

[tasks."test:frontend"]
description = "Run all frontend TypeScript tests"
depends = ["quality:frontend", "test:frontend:unit"]

[tasks.test]
description = "Run all tests"
depends = "test:*"

[tasks.compile]
description = "Compile frontend TypeScript"
run = "pnpm run build:typescript"
dir = "./frontend"
hide = true

[tasks.build]
description = "Build Block"
usage = '''
arg "<xblock>" help="XBlock to build"
'''
run = "XBLOCK=${usage_xblock} pnpm run build:vite"
dir = "./frontend"
depends = ["compile"]

[tasks."build:watch"]
description = "Build a specific block in watch mode"
usage = '''
arg "<xblock>" help="XBlock to build"
'''
run = "XBLOCK=${usage_xblock} pnpm run build:watch"
dir = "./frontend"
depends = ["compile"]

[tasks."build:all"]
description = "Build all blocks"
depends = ["build card_carousel", "build card_grid", "build keypoint_block", "build cover_block", "build two_column_block", "build ideas_overview_block", "build unfolding_scenario"]

[tasks.preview]
description = "Preview Block"
usage = '''
arg <xblock> help="XBlock to preview"
'''
run = '''
XBLOCK=${usage_xblock?} pnpm run preview
'''
dir = "./frontend"

[tasks."preview:all"]
description = "Preview all blocks"
depends =  ["preview card_carousel", "preview card_grid", "preview keypoint_block", "preview cover_block", "preview two_column_block", "preview ideas_overview_block"]


[tools]
"npm:pnpm" = "latest"
